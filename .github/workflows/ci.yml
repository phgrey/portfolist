name: CI Quality & Static Analysis Pipeline

on:
  push:
    branches:
      - 'feature/*'
  pull_request:
    branches:
      - main
      - firebase

jobs:
  ci-quality-checks:
    name: Lint, Typecheck, Test & Coverage
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Inject Application Configuration (Test Environment)
        env:
          CONFIG_TEST: ${{ secrets.APP_CONFIG_JS_TEST }}
          CONFIG_GENERIC: ${{ secrets.APP_CONFIG_JS }}
        run: |
          if [ -n "$CONFIG_TEST" ]; then
            printf '%s\n' "$CONFIG_TEST" > config.js
          elif [ -n "$CONFIG_GENERIC" ]; then
            printf '%s\n' "$CONFIG_GENERIC" > config.js
          else
            cp config.example.js config.js
          fi

      - name: Validate Configuration File
        run: |
          if [ ! -f config.js ]; then
            echo "Error: config.js was not created"
            exit 1
          fi
          node -e "require('./config.js')"
          echo "✓ Configuration file is valid"

      - name: Cache node_modules
        id: cache-nodemodules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}

      - name: Install Dependencies
        if: steps.cache-nodemodules.outputs.cache-hit != 'true'
        run: npm ci || npm i

      - name: 1. Static Analysis & Type Checking
        run: npm run lint

      - name: 2. Production Build Validation
        run: npm run build

      - name: 3. Execute Unit Tests & Code Coverage
        run: npm run test:coverage
