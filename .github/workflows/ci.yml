name: CI Quality & Static Analysis Pipeline

on:
  push:
    branches:
      - 'feature/*'
  pull_request:
    branches:
      - main
      - firebase

jobs:
  ci-quality-checks:
    name: Lint, Typecheck, Test & Coverage
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Inject Application Configuration
        env:
          SECRET_CONFIG: ${{ secrets.APP_CONFIG_JS_TEST || secrets.APP_CONFIG_JS }}
        run: |
          if [ -n "$SECRET_CONFIG" ]; then
            printf '%s\n' "$SECRET_CONFIG" > config.cjs
          else
            cp config.example.cjs config.cjs
          fi

      - name: Validate Configuration File
        run: node -e "require('./config.cjs')"

      - name: Install Dependencies
        if: steps.cache-nodemodules.outputs.cache-hit != 'true'
        run: npm ci || npm i

      - name: 1. Static Analysis & Type Checking
        run: npm run lint

      - name: 2. Production Build Validation
        run: npm run build

      - name: 3. Execute Unit Tests & Code Coverage
        run: npm run test:coverage
