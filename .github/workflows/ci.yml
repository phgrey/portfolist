name: CI Quality & Static Analysis Pipeline

on:
  push:
    branches:
      - 'feature/*'
  pull_request:
    branches:
      - main
      - firebase

jobs:
  ci-quality-checks:
    name: Lint, Typecheck, Test & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: 1. Static Analysis & Type Checking
        run: npm run lint

      - name: 2. Production Build Validation
        run: npm run build

      - name: 3. Execute Unit Tests & Code Coverage
        run: npm run test:coverage
