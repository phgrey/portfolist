name: CD Firebase Deployment Pipeline

on:
  push:
    branches:
      - firebase

jobs:
  deploy-to-firebase:
    name: Build, Migrate & Deploy to Firebase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: 1. Build Web Application & Backend Bundle
        run: npm run build

      - name: 2. Execute Database Migrations
        env:
          DB_URL: ${{ secrets.DB_URL }}
          FIREBASE_PROJECT_ID: "portfolist-a3725"
        run: npm run db:migrate

      - name: 3. Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_PORTFOLIST_A3725 }}'
          channelId: live
          projectId: portfolist-a3725
