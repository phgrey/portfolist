name: CD Firebase Deployment Pipeline

on:
  push:
    branches:
      - firebase

jobs:
  deploy-to-firebase:
    name: Build, Migrate & Deploy to Firebase
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Inject Application Configuration
        env:
          SECRET_CONFIG: ${{ secrets.APP_CONFIG_JS_PROD || secrets.APP_CONFIG_JS }}
        run: |
          if [ -n "$SECRET_CONFIG" ]; then
            printf '%s\n' "$SECRET_CONFIG" > config.cjs
          else
            cp config.example.cjs config.cjs
          fi

      - name: Validate Configuration File
        run: node -e "require('./config.cjs')"

      - name: Cache node_modules
        id: cache-nodemodules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}

      - name: Install Dependencies
        if: steps.cache-nodemodules.outputs.cache-hit != 'true'
        run: npm ci || npm i

      - name: 1. Build Web Application & Backend Bundle
        run: npm run build

      - name: 2. Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_PORTFOLIST_A3725 }}'
          channelId: live
          projectId: portfolist-a3725
